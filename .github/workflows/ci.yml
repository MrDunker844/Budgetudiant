# Intégration continue : vérifie le back, le front et l'image Docker
# à chaque push sur main et à chaque Pull Request vers main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Backend : FastAPI + vrai MySQL ----------
  backend:
    name: Backend (FastAPI + MySQL)
    runs-on: ubuntu-latest

    # Variables lues par backend/database.py (base jetable, uniquement pour la CI)
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_password' }}
      DB_NAME: budget_etudiant

    # Lance un conteneur MySQL à côté du job
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_password' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r backend/requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend

      # Tests automatiques : utilisent une fausse base, pas besoin de MySQL
      - name: Lancer les tests (pytest)
        working-directory: backend
        run: pytest -v

      - name: Importer le script SQL
        run: mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" < database/schema.sql

      - name: Démarrer l'API
        working-directory: backend
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          # Attend que l'API réponde (max 30 s)
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Tester /api/health (API + base + tables)
        run: |
          curl -s http://127.0.0.1:8000/api/health | python -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data)
          assert data['database'] == 'ok', 'La base ne répond pas'
          assert data['expenses'] > 0, 'Aucune dépense de test'
          assert data['incomes'] > 0, 'Aucun revenu de test'
          "

      - name: Afficher les logs de l'API en cas d'échec
        if: failure()
        run: cat backend/uvicorn.log || true

  # ---------- Frontend : lint + build ----------
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------- Docker : l'image de l'API se construit ----------
  docker:
    name: Docker (build de l'image API)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # backend/.env n'est pas versionné : on le crée à partir du modèle
      - name: Créer backend/.env
        run: cp backend/.env.example backend/.env

      - name: Vérifier docker-compose.yml
        run: docker compose --env-file backend/.env config --quiet

      - name: Construire l'image de l'API
        run: docker compose --env-file backend/.env build api
